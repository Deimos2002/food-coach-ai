name: Demo image
# Publishes the image the public coach playground runs (uvicorn app.demo:create_demo_app).
on:
  push:
    branches: [main]
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: GIT_SHA=${{ github.sha }}
          tags: |
            ghcr.io/deimos2002/food-coach-ai:latest
            ghcr.io/deimos2002/food-coach-ai:sha-${{ github.sha }}
